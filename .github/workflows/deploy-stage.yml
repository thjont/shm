name: Deploy to stage environment

on:
    workflow_dispatch:

# Shared with the other deploys and update-bgg-cache.yml, which refreshes and
# pushes the stage cache and deploys stage itself — see deploy-prod.yml.
concurrency:
    group: site-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: true

            # Stage has its own spreadsheet and calendar, sharing the prod service
            # account — see GOOGLE-SETUP.md. It doesn't push its cache back: the
            # daily refresh owns bgg-cache-stage.
            - name: Sync and export
              uses: ./.github/actions/sync-and-export
              with:
                  stage: stage
                  google-service-account-key: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
                  google-calendar-id: ${{ secrets.GOOGLE_CALENDAR_ID_STAGE }}
                  google-sheets-spreadsheet-id: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID_STAGE }}
                  bgg-api-token: ${{ secrets.BGG_API_TOKEN }}

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Build site
              run: pushd shiny-hoppy-meeple && hugo --minify --buildFuture --baseURL "https://stage-shiny-hoppy-meeple.pages.dev/" && popd

            - name: Use stage wrangler config
              run: cp shiny-hoppy-meeple/wrangler-stage.toml shiny-hoppy-meeple/wrangler.toml

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: shiny-hoppy-meeple
                  command: pages deploy --commit-hash=${{ github.sha }}
