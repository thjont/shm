name: CI

on:
    pull_request:
    push:
        branches: [main, dev]

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint JavaScript
              run: npm run lint:js

            - name: Unit tests
              run: npm test

            - name: Lint Markdown (non-blocking)
              continue-on-error: true
              run: npm run lint:md

    # eslint can't see a broken template or a changed _content.gotmpl data
    # contract — those only surface in a Hugo build, which until now happened
    # first in the deploy. Same check as `just check`.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: true

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                  hugo-version: "0.163.1"
                  extended: true

            # Read-only: the dev cache gives the game and member templates real
            # data to render. cache-pull.sh falls back to an empty cache if the
            # branch or the fetch is unavailable, and the build still succeeds —
            # it just covers fewer pages.
            - name: Restore BGG cache (dev)
              run: scripts/cache-pull.sh dev

            - name: Build site
              run: pushd shiny-hoppy-meeple && hugo --renderToMemory && popd
