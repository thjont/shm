name: Deploy to prod environment

on:
    push:
        branches: [main]
        paths:
            - "shiny-hoppy-meeple/**"
    schedule:
        - cron: "0 8-23 * * *"
    workflow_dispatch:

# One queue shared by every workflow that writes a cache branch or deploys the
# site. Two prod runs (push + cron + the Apps Script dispatch button all fire
# this one) would otherwise both run cache-push.sh — the loser hard-fails on a
# non-fast-forward push — and race `wrangler pages deploy`, letting the older
# build win. update-bgg-cache.yml writes all three cache branches, so it has to
# share this group rather than have a per-environment one; the cost is that a
# dev or stage deploy can queue behind a prod run for a few minutes.
# Never cancel in progress: a run killed mid cache-push leaves the branch and
# the deployed site out of step.
concurrency:
    group: site-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            deployments: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: true

            - name: Sync and export
              uses: ./.github/actions/sync-and-export
              with:
                  stage: prod
                  google-service-account-key: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
                  google-calendar-id: ${{ secrets.GOOGLE_CALENDAR_ID }}
                  google-sheets-spreadsheet-id: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
                  bgg-api-token: ${{ secrets.BGG_API_TOKEN }}
                  fingerprint-inputs: "true"

            - name: Push BGG cache
              id: push-cache
              run: scripts/cache-push.sh prod

            - name: Setup Hugo
              if: github.event_name != 'schedule' || steps.push-cache.outputs.changed_prod == 'true'
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                  hugo-version: "0.163.1"
                  extended: true

            - name: Build site
              if: github.event_name != 'schedule' || steps.push-cache.outputs.changed_prod == 'true'
              run: pushd shiny-hoppy-meeple && hugo --minify && popd

            # functions/_middleware.js exists only for the dev/stage basic-auth
            # gate, but its presence puts /* into the generated routes, so every
            # prod image, stylesheet and HTML request pays a Function invocation
            # before Pages serves it. Restrict prod to the routes that actually
            # need Functions; dev and stage ship no _routes.json, so their
            # middleware keeps covering everything. Same copy-after-build pattern
            # as the wrangler-*.toml files.
            - name: Limit prod Functions routes
              if: github.event_name != 'schedule' || steps.push-cache.outputs.changed_prod == 'true'
              run: cp shiny-hoppy-meeple/routes-prod.json shiny-hoppy-meeple/public/_routes.json

            - name: Deploy to Cloudflare Pages
              if: github.event_name != 'schedule' || steps.push-cache.outputs.changed_prod == 'true'
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: shiny-hoppy-meeple
                  command: pages deploy --commit-hash=${{ github.sha }}

            # A skipped hourly run should say so, rather than looking like a deploy.
            - name: Note skipped deploy
              if: github.event_name == 'schedule' && steps.push-cache.outputs.changed_prod != 'true'
              run: |
                  echo "No sheet, calendar or BGG cache changes this hour — skipped build and deploy." \
                    >> "$GITHUB_STEP_SUMMARY"
